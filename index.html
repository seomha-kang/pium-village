<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#215744"><meta name="description" content="피움이와 작은 마음마을을 탐험하며 마음의 꽃잎 다섯 개를 찾아보세요. 동신대학교 학생상담센터 모바일 RPG.">
  <title>피움이의 마음마을</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23215744'/%3E%3Cg fill='white'%3E%3Cellipse cx='16' cy='10' rx='5' ry='8'/%3E%3Cellipse cx='10' cy='18' rx='8' ry='5' transform='rotate(25 10 18)'/%3E%3Cellipse cx='22' cy='18' rx='8' ry='5' transform='rotate(-25 22 18)'/%3E%3C/g%3E%3Ccircle cx='16' cy='18' r='4' fill='%23f2c84b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game" aria-label="피움이의 마음마을 게임">
  <canvas id="world" aria-label="마음마을. 방향키 또는 왼쪽 아래 조이스틱으로 피움이를 움직이세요."></canvas>
  <header id="hud" hidden><div class="village-name">피움이의 <strong>마음마을</strong></div><button id="collection" class="collection" aria-label="모은 꽃잎 보기"><span>🌸 마음의 꽃잎</span> <b id="count">0 / 5</b><span id="petals" aria-hidden="true">○ ○ ○ ○ ○</span></button><button id="help" class="round" aria-label="조작 방법">?</button></header>
  <section id="start" class="start-screen">
    <div class="start-copy"><span class="eyebrow">동신대학교 학생상담센터</span><h1><span>피움이의</span>마음마을</h1><p>마음의 꽃잎을 찾아 떠나볼까요?</p></div>
    <div class="mascot-stage"><img class="hero-pium" src="./pium-original.png" alt="하얀 꽃을 머리에 쓴 피움이, 동신대학교 학생상담센터 캐릭터"><span class="floating-petal p1">🌸</span><span class="floating-petal p2">🌸</span><span class="floating-petal p3">🌸</span></div>
    <div class="start-bottom"><div class="adventure-note">작은 마을, 다섯 번의 만남</div><button id="start-button" class="primary">게임 시작 <span>✦</span></button><p class="save-note" id="save-note">완료한 퀘스트는 이 기기에 저장돼요.</p></div>
  </section>
  <div id="controls" hidden><p id="nearby" aria-live="polite">꽃잎을 찾아 마을을 둘러보세요.</p><div class="control-row"><div id="joystick" role="group" aria-label="이동 조이스틱"><span class="axis up">▲</span><span class="axis down">▼</span><span class="axis left">◀</span><span class="axis right">▶</span><div id="stick"></div></div><span class="control-hint">움직여서<br>문 앞으로!</span><button id="enter" disabled>입장<span>문 가까이 가세요</span></button></div></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-shell"><header class="dialog-header"><div><span id="dialog-kicker" class="eyebrow"></span><h2 id="dialog-title"></h2></div><button id="close-dialog" class="round" aria-label="마을로 돌아가기">×</button></header><div id="dialog-body"></div><footer id="dialog-actions"></footer></div></dialog>
  <div id="toast" role="status" hidden></div>
</main>
<script src="content.js"></script><script src="game.js?v=2"></script>
</body></html>
